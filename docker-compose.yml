services:
  onecerabond:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onecerabond-app
    restart: unless-stopped
    ports:
      - "3007:3000"
    environment:
      - NODE_ENV=production
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
